
    <svg width="250" height="64" viewBox="0 0 250 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="fullLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FF6B00" />
          <stop offset="100%" stop-color="#FF5100" />
        </linearGradient>
        <filter id="fullLogoShadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.14"/>
        </filter>
      </defs>

      <!-- ICON GROUP -->
      <g transform="translate(2, 4) scale(0.64)">
        <!-- Speed Motion Lines -->
        <path d="M 6 24 L 24 24" stroke="url(#fullLogoGrad)" stroke-width="4.5" stroke-linecap="round" />
        <path d="M 2 38 L 20 38" stroke="url(#fullLogoGrad)" stroke-width="4.5" stroke-linecap="round" />
        <path d="M 8 52 L 26 52" stroke="url(#fullLogoGrad)" stroke-width="4.5" stroke-linecap="round" />

        <!-- Main Cart Body -->
        <g filter="url(#fullLogoShadow)">
          <path d="M 32 14 
                   C 32 10, 36 8, 41 8 
                   L 84 8 
                   C 89 8, 93 11, 92 16 
                   L 84 54 
                   C 83 58, 79 61, 74 61 
                   L 42 61 
                   C 37 61, 33 57, 32 52 
                   Z" 
                fill="url(#fullLogoGrad)" />

          <!-- Cart Handle -->
          <path d="M 82 8 L 94 8 C 98 8, 101 11, 100 15 L 97 27" 
                stroke="url(#fullLogoGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

          <!-- Negative Space Letter 'C' Cutout -->
          <path d="M 68 25 
                   C 64 21, 57 20, 50 23 
                   C 42 27, 40 37, 42 43 
                   C 44 49, 51 52, 58 51 
                   C 64 50, 68 46, 68 46 
                   L 63 41 
                   C 63 41, 60 44, 56 44 
                   C 51 45, 48 42, 47 38 
                   C 46 34, 48 31, 52 30 
                   C 56 29, 61 31, 63 33 
                   Z" 
                fill="#FFFFFF" />

          <!-- Wheels -->
          <circle cx="48" cy="72" r="6" fill="#1F2937" />
          <circle cx="48" cy="72" r="2.5" fill="#FFFFFF" />
          <circle cx="76" cy="72" r="6" fill="#1F2937" />
          <circle cx="76" cy="72" r="2.5" fill="#FFFFFF" />
        </g>
      </g>

      <!-- WORDMARK: CARTLY -->
      <text 
        x="76" 
        y="44" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
        font-weight="900" 
        font-size="34px" 
        letter-spacing="-0.03em" 
        fill="#111827"
      >CARTLY</text>

      
    </svg>
  